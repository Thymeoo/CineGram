<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Lecteur YouTube Immersif</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    iframe#backgroundVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      pointer-events: none;
    }

    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      color: white;
      width: 100%;
    }

    iframe#mainVideo, video#mainVideo {
      width: 85%;
      max-width: 1100px;
      height: 600px;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    }

    button {
      padding: 12px 24px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #357ab7;
    }

    #changeAmbianceButton {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      z-index: 15;
    }

    #ambianceMenu {
      display: none;
      position: fixed;
      top: 80px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 15px;
      border-radius: 8px;
      width: 220px;
      z-index: 20;
    }

    #ambianceMenu input {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
      font-size: 14px;
      background-color: #333;
      color: white;
    }

    #ambianceMenu button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background-color: #333;
      border-radius: 5px;
      border: none;
      color: white;
      font-size: 16px;
    }

    #ambianceMenu button:hover {
      background-color: #4a90e2;
    }
  </style>
</head>
<body>

  <div id="videoContainer">
    <iframe id="backgroundVideo" src="https://www.youtube.com/embed/0TBR16CBfZo?autohide=1&mute=1&loop=1&playlist=0TBR16CBfZo&autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <div class="content">
    <iframe id="mainVideo" src="https://www.youtube.com/embed/1mAGDQUwTBY" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <br>
    <button onclick="changeVideo()">Changer de vidéo</button>
  </div>

  <button id="changeAmbianceButton" onclick="toggleAmbianceMenu()">🎧</button>

  <div id="ambianceMenu">
    <h4>Changer l'ambiance :</h4>
    <input type="text" id="youtubeLink" placeholder="Coller un lien YouTube...">
    <button onclick="setCustomAmbiance()">Appliquer</button>
    <br><br>
    <button onclick="setSpecialAmbiance()">Ambiance Spéciale</button> <!-- Bouton ajouté -->
  </div>

  <script>
    function toggleAmbianceMenu() {
      const menu = document.getElementById("ambianceMenu");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function setCustomAmbiance() {
      const link = document.getElementById("youtubeLink").value;
      const videoId = extractYouTubeID(link);
      if (videoId) {
        document.getElementById("backgroundVideo").src =
          `https://www.youtube.com/embed/${videoId}?autohide=1&mute=1&loop=1&playlist=${videoId}&autoplay=1`;
        document.getElementById("ambianceMenu").style.display = "none";
      } else {
        alert("Lien non valide, vérifie l'URL YouTube !");
      }
    }

    function extractYouTubeID(url) {
      const regex = /(?:youtube\.com\/.*v=|youtu\.be\/)([^&\s]+)/;
      const match = url.match(regex);
      return match ? match[1] : null;
    }

    function changeVideo() {
      const url = prompt("Colle un lien YouTube, Twitch, Vimeo ou .mp4 pour la vidéo principale :");
      if (!url) return;

      const container = document.querySelector('.content');
      const oldFrame = document.getElementById('mainVideo');
      if (oldFrame) oldFrame.remove();

      const newElement = createVideoElement(url);
      if (newElement) {
        container.insertBefore(newElement, container.querySelector('button'));
      } else {
        alert("Lien non pris en charge !");
      }
    }

    function createVideoElement(url) {
      let embedUrl, element;

      // YouTube
      const ytId = extractYouTubeID(url);
      if (ytId) {
        embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        element = document.createElement('iframe');
        element.src = embedUrl;
      }
      // Twitch
      else if (url.includes("twitch.tv")) {
        const channelMatch = url.match(/twitch\.tv\/([^\/?&]+)/);
        if (channelMatch) {
          embedUrl = `https://player.twitch.tv/?channel=${channelMatch[1]}&parent=localhost`;
          element = document.createElement('iframe');
          element.src = embedUrl;
        }
      }
      // Vimeo
      else if (url.includes("vimeo.com")) {
        const vimeoMatch = url.match(/vimeo\.com\/(\d+)/);
        if (vimeoMatch) {
          embedUrl = `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1`;
          element = document.createElement('iframe');
          element.src = embedUrl;
        }
      }
      // MP4, WebM, OGG
      else if (url.match(/\.(mp4|webm|ogg)$/)) {
        element = document.createElement('video');
        element.src = url;
        element.autoplay = true;
        element.controls = true;
        element.loop = true;
      }

      if (element) {
        element.id = "mainVideo";
        element.style.width = "85%";
        element.style.maxWidth = "1100px";
        element.style.height = "600px";
        element.style.borderRadius = "15px";
        element.style.boxShadow = "0 0 30px rgba(0, 0, 0, 0.6)";
        element.style.border = "none";
        return element;
      }

      return null;
    }

    function setSpecialAmbiance() {
      // Remplir l'input avec le lien spécial
      document.getElementById("youtubeLink").value = "https://www.youtube.com/watch?v=9XCyKtFsYbg";
      // Appliquer le lien spécial pour la vidéo de fond
      setCustomAmbiance();
      document.getElementById("ambianceMenu").style.display = "none";
    }

  </script>

</body>
</html>
